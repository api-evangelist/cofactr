- aid: cofactr:cofactr-batch-api
  name: Cofactr batch API
  description: >-
    Execute multiple product queries in a single request. Each batch member is an operation against the
    products API expressed as a relative URL; members are fulfilled concurrently and returned in order.
  humanURL: >-
    https://support.cofactr.com/articles/7816454452-cofactr-component-cloud-api-documentation
  baseURL: https://graph.cofactr.com
  tags:
