  - type: APIReference
    url: https://graph.cofactr.com/openapi.json
- aid: cofactr:cofactr-products-api
  name: Cofactr products API
  description: >-
    Search, view, and autocomplete electronic component products. Every product is a unique combination
    of manufacturer (`mfr`) and manufacturer part number (`mpn`), identified by a Cofactr ID (CPID). Product
    responses are shaped by the requested `schema` and can include specs, documents, compliance data,
    and market offers.
  humanURL: >-
    https://support.cofactr.com/articles/7816454452-cofactr-component-cloud-api-documentation
