                type: string
components:
  schemas:
    ProductBatchResponse:
      type: array
      items:
        $ref: '#/components/schemas/BatchMemberResult'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ProductsBatch:
      properties:
        batch:
          items:
            $ref: '#/components/schemas/APIOperation'
          type: array
          maxItems: 250
          title: Batch
      type: object
      required:
      - batch
      title: ProductsBatch
      description: Batch of product requests.
      examples:
      - batch:
        - method: GET
          relative_url: ?q=GCM21BR72A104KA37L&schema=product-offers-v1&external=true&search_strategy=mpn_sku_mfr
        - method: GET
          relative_url: ?filtering=[{"field":"id","operator":"IN","value":["CC2DKKO1LUCF"]}]&schema=product-v1
    BatchMemberResult:
      type: object
      required:
      - code
      - body
      properties:
        code:
          type: integer
          description: HTTP status code the member request would have received as a standalone request.
        body:
          description: 'The JSON body the member request would have received as a standalone request: a product list envelope (`ProductListResponse`) on success, or a validation/error body on failure.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Human-readable explanation of the error.
    APIOperation:
      properties:
        method:
          type: string
          const: GET
          title: Method
        relative_url:
          type: string
          title: Relative Url
      type: object
      required:
      - method
      - relative_url
      title: APIOperation
      description: API Operation for GET requests.
  parameters:
    Timeout:
      name: timeout
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
        - type: 'null'
        title: Timeout
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Issued with your client ID as one Cofactr credential set. Never expose your API key in front-end code or public Git repositories. The Cofactr API is for server-side use only. Public disclosure of a key results in immediate revocation without prior warning.
      x-display-name: API key
      x-auth-set: CofactrCredentials
      x-auth-set-display-name: Cofactr API credentials
    ClientId:
      type: apiKey
      in: header
      name: X-CLIENT-ID
      description: Issued with your API key as one Cofactr credential set.
      x-display-name: Client ID
      x-auth-set: CofactrCredentials
      x-auth-set-display-name: Cofactr API credentials
