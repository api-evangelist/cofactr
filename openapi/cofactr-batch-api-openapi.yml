openapi: 3.1.0
info:
  title: Cofactr Knowledge Graph batch API
  version: '2026-07-10'
  x-logo:
    url: /static/cofactr_logo.png
  description: Execute multiple product queries in a single request. Each batch member is an operation against the products API expressed as a relative URL; members are fulfilled concurrently and returned in order.
servers:
- url: https://graph.cofactr.com
  description: Production
security:
- ApiKey: []
  ClientId: []
tags:
- name: batch
  description: Execute multiple product queries in a single request. Each batch member is an operation against the products API expressed as a relative URL; members are fulfilled concurrently and returned in order.
paths:
  /batch/products/:
    post:
      tags:
      - batch
      summary: Execute a batch of product queries
      description: Execute a batch of product queries.
      operationId: batchProducts
      parameters:
      - $ref: '#/components/parameters/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductsBatch'
      responses:
        '200':
          description: One response per batch member, in request order. Each member carries the status code and body it would have received as a standalone request.
          content:
